name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and packager
        run: python -m pip install -e . pyinstaller==6.16.0
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Autotyper --paths src packaging/windows_launcher.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Autotyper-Windows
          path: dist/Autotyper.exe
          if-no-files-found: error
