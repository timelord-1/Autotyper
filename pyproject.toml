[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotyper"
version = "0.1.0"
description = "Windows desktop autotyper with a global emergency stop"
requires-python = ">=3.11"
dependencies = []

[project.gui-scripts]
autotyper = "autotyper.app:main"

[tool.setuptools.packages.find]
where = ["src"]
